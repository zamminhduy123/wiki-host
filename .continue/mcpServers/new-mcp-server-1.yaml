name: New MCP server
version: 0.0.1
schema: v1
mcpServers:
  - name: context7
    command: "npx"
    args:
      - "-y"
      - "@upstash/context7-mcp"
    env:
      CONTEXT7_API_KEY: "your_api_key_here"
  - name: New MCP server
    command: npx
    args:
      - -y
      - <your-mcp-server>
    env: {}
